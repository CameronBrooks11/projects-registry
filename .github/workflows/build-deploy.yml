name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Scan GitHub and add pending entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Scan the newest main, not the commit that started this run: an entry merged
        # meanwhile must count as listed, or the scan adds a duplicate stub (#69). The
        # stub is validated before it is committed, and a push that loses to a new
        # merge scans again on top of it.
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/scan_github_pending.py
            if [ -z "$(git status --porcelain data/pending)" ]; then
              echo "No changes in data/pending"
              break
            fi
            python scripts/validate.py
            git add data/pending
            git commit -m "chore(pending): add new repos [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "main kept moving; leaving the scan to the next run" >&2
              exit 1
            fi
          done

      - name: Validate project data
        run: python scripts/validate.py

      - name: Build dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --enrich

      - name: Install Node deps
        run: npm install

      - name: Build VitePress site
        run: npm run build

      - name: Verify dataset presence
        run: ls -R dist || echo "dist missing"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
