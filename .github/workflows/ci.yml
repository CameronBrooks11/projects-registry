name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: these jobs only read the repository.
# A job needing more declares it itself, so the elevation stays visible
# at the job that uses it.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Validate project data
        run: python scripts/validate.py --skip-pending
