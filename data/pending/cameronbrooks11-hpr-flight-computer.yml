notes: Restructured copy of SparkyVT's HPR Rocket Flight Computer V4.6. A flight
  computer for high-powered rockets based on the Teensy platform. 4 programmable pyro
  outputs, Mach immune flight events, air-start & two-stage capable w/ tilt-sensing
  safety features, GPS & live telemetry. High-rate data logging at 1000 samples per
  second. 4.0in x 1.25in x 0.5in fits in a 38mm tube coupler.
